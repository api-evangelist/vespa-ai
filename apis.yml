    type: Documentation
- aid: vespa-ai:vespa-tenant-api
  name: Vespa Tenant and Application API
  description: >-
    The Vespa Tenant API (/application/v2/tenant) manages tenants and applications hosted on a Vespa configuration
    server or Vespa Cloud control plane. It exposes operations for creating tenants, listing applications,
    and binding application sessions to a tenant.
  humanURL: https://docs.vespa.ai/en/reference/application-v2-tenant.html
  tags:
  - Tenants
  - Applications
  - Multi-Tenancy
  - Administration
  properties:
