    type: Documentation
  - url: https://docs.vespa.ai/en/reads-and-writes.html
    type: Documentation
- aid: vespa-ai:vespa-deploy-api
  name: Vespa Deploy API
  description: >-
    The Vespa Deploy API (/application/v2) manages application packages on a Vespa configuration server.
    It supports preparing, activating, and tearing down application packages, session-based deployments,
    schema validation, and zero-downtime updates of services, schemas, and rank profiles.
  humanURL: https://docs.vespa.ai/en/reference/deploy-rest-api-v2.html
  tags:
  - Deployment
  - Configuration
  - Application
  - DevOps
