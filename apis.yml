    type: Documentation
- aid: vespa-ai:vespa-config-api
  name: Vespa Config API
  description: >-
    The Vespa Config API (/config/v2) lets services in a Vespa application retrieve their configuration
    from a Vespa configuration server using the config-server / config-proxy protocol. It is primarily
    used by Vespa services and tooling rather than end users, but is documented as a stable HTTP API.
  humanURL: https://docs.vespa.ai/en/reference/config-rest-api-v2.html
  tags:
  - Configuration
  - Internal
  properties:
  - url: https://docs.vespa.ai/en/reference/config-rest-api-v2.html
    type: Documentation
