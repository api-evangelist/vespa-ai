apis:
- aid: vespa-ai:vespa-document-api
  name: Vespa Document API
  description: >-
    The Vespa Document API (/document/v1) provides synchronous REST access to document operations against
    a Vespa content cluster. It supports Put, Get, Update (partial update with assign/add/remove operators),
    Remove, and Visit (streaming visit, copy, delete-where, update-where) over JSON or JSON Lines, with
    conditional writes, multi-tenant namespaces, field-set projection, time-window selection, and pagination
    via continuation tokens.
  humanURL: https://docs.vespa.ai/en/reference/document-v1-api-reference.html
  tags:
  - Documents
  - CRUD
  - Indexing
  - Data
  - Streaming
  properties:
