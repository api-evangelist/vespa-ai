specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Vespa
providerId: vespa-ai
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - AI Search
  - Vector Database
description: FOCUS-aligned FinOps mapping for Vespa Cloud. Vespa Cloud bills on resource units
  (vCPU-hour, GiB-memory-hour, GiB-disk-hour, GiB-GPU-memory-hour) per application zone, with
  volume and commit discounts applied at the invoice level.
sources:
  - https://cloud.vespa.ai/pricing
  - https://cloud.vespa.ai/price-calculator.html
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Vespa.ai
serviceCategory: AI Search Platform
billingModel:
  pricingCategory: Usage-Based + Subscription Minimum (Enterprise)
  billingFrequency: Monthly
  billingCurrency: USD
focusColumns:
  ServiceName: Vespa Cloud
  ServiceCategory: AI Search Platform
  ProviderName: Vespa.ai
  PublisherName: Vespa.ai
  BillingCurrency: USD
meters:
  - name: vcpu
    unit: vCPU-hour
    aggregation: sum
    dimensions:
      - tenant
      - application
      - zone
      - cluster
      - plan
  - name: memory
    unit: GiB-hour
    aggregation: sum
    dimensions:
      - tenant
      - application
      - zone
      - cluster
      - plan
  - name: disk
    unit: GiB-hour
    aggregation: sum
    dimensions:
      - tenant
      - application
      - zone
      - cluster
      - plan
  - name: gpu_memory
    unit: GiB-hour
    aggregation: sum
    dimensions:
      - tenant
      - application
      - zone
      - cluster
      - plan
principles:
  - name: Visibility
    description: Inspect monthly Vespa Cloud invoices and per-application usage in the Vespa Cloud
      console; export CSV for cost-allocation.
  - name: Allocation
    description: Tag tenants, applications, and zones for chargeback to teams or business lines.
  - name: Optimization
    description: Right-size containers and content clusters; consolidate dev workloads in shared
      Startup zones; use volume and commit discounts.
  - name: Accountability
    description: Set monthly budgets per tenant or application; review usage and right-sizing
      quarterly.
